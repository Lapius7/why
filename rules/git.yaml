# git

- id: git-not-repo
  output: '(?i)not a git repository'
  example: "fatal: not a git repository (or any of the parent directories): .git"
  cause: "今いるディレクトリは git リポジトリではない"
  fix:
    - "リポジトリのディレクトリに移動する（pwd で現在地を確認）"
    - "新しく始めるなら: git init"

- id: git-push-rejected
  output: '\[rejected\].*\((?:fetch first|non-fast-forward)\)|Updates were rejected because'
  example: " ! [rejected]        main -> main (fetch first)"
  cause: "リモートに手元にないコミットがあるため push が拒否された"
  fix:
    - "取り込んでから push する: git pull --rebase && git push"
    - "履歴を書き換えた後で上書きが意図通りなら: git push --force-with-lease"

- id: git-no-upstream
  output: 'has no upstream branch'
  example: "fatal: The current branch feature has no upstream branch."
  cause: "このブランチに push 先（upstream）が設定されていない"
  fix:
    - "設定して push する: git push -u origin HEAD"
    - "毎回自動設定するなら: git config --global push.autoSetupRemote true"

- id: git-src-refspec
  output: 'src refspec (?P<ref>\S+) does not match any'
  example: "error: src refspec main does not match any"
  cause: "push しようとしたブランチ「{{ref}}」が手元にない（名前違い、またはまだコミットがない）"
  fix:
    - "ブランチ名を確認する: git branch（main / master の違いに注意）"
    - "まだコミットしていないなら先に: git add . && git commit"

- id: git-https-auth
  output: 'Authentication failed for|could not read Username|Invalid username or (?:password|token)'
  example: "fatal: Authentication failed for 'https://github.com/user/repo.git/'"
  cause: "HTTPS での認証に失敗した（GitHub はパスワード認証不可）"
  fix:
    - "gh でログインして認証情報を設定する: gh auth login && gh auth setup-git"
    - "または SSH の URL に切り替える: git remote set-url origin git@github.com:<user>/<repo>.git"

- id: git-repo-not-found
  output: 'Repository not found|repository ''.*'' not found|does not appear to be a git repository'
  example: "ERROR: Repository not found."
  cause: "リポジトリが見つからない（URL の誤り、またはアクセス権がない）"
  fix:
    - "リモートの URL を確認する: git remote -v"
    - "非公開リポジトリならアクセス権と認証アカウントを確認する: gh auth status"

- id: git-conflict
  output: 'CONFLICT \(|Automatic merge failed|fix conflicts and then|could not apply [0-9a-f]+'
  example: "CONFLICT (content): Merge conflict in src/app.ts"
  cause: "マージ（リベース）でコンフリクトが起きた"
  fix:
    - "衝突しているファイルを確認する: git status"
    - "<<<<<<< ======= >>>>>>> の部分を直して git add <ファイル>"
    - "続ける: git merge --continue / git rebase --continue"
    - "やめて元に戻す: git merge --abort / git rebase --abort"

- id: git-local-changes
  output: 'Your local changes to the following files would be overwritten'
  example: "error: Your local changes to the following files would be overwritten by checkout:"
  cause: "コミットしていない変更があり、この操作で上書きされてしまう"
  fix:
    - "一時退避する: git stash → 操作 → git stash pop"
    - "またはコミットしてから操作する"

- id: git-untracked-overwritten
  output: 'untracked working tree files would be overwritten'
  example: "error: The following untracked working tree files would be overwritten by merge:"
  cause: "管理外のファイルが、取り込もうとしているファイルと同名で衝突している"
  fix:
    - "該当ファイルを別の場所に移すか削除してからやり直す"

- id: git-index-lock
  output: 'index\.lock''?: File exists|Another git process seems to be running'
  example: "fatal: Unable to create '/repo/.git/index.lock': File exists."
  cause: "git のロックファイルが残っている（別の git が実行中、または異常終了の残骸）"
  fix:
    - "他に git（エディタの git 連携を含む）が動いていないか確認する: procs git"
    - "動いていなければ消す: rm -f .git/index.lock"

- id: git-pathspec
  output: 'pathspec ''(?P<spec>[^'']+)'' did not match'
  example: "error: pathspec 'feture' did not match any file(s) known to git"
  cause: "「{{spec}}」というブランチ・ファイルが見つからない"
  fix:
    - "ブランチ名を確認する: git branch -a"
    - "リモートのブランチならまず取得する: git fetch"

- id: git-unrelated-histories
  output: 'refusing to merge unrelated histories'
  example: "fatal: refusing to merge unrelated histories"
  cause: "共通の祖先を持たない 2 つの履歴をマージしようとした"
  fix:
    - "意図通りなら: git pull --allow-unrelated-histories"
    - "リモートの URL が正しいか確認する: git remote -v"

- id: git-divergent
  output: '(?i)divergent branches|Not possible to fast-forward'
  example: "hint: You have divergent branches and need to specify how to reconcile them."
  cause: "手元とリモートの両方に新しいコミットがあり、統合方法が決まっていない"
  fix:
    - "今回だけ: git pull --rebase"
    - "既定にする: git config --global pull.rebase true"

- id: git-nothing-to-commit
  output: 'nothing to commit|no changes added to commit|nothing added to commit'
  example: "no changes added to commit (use \"git add\" and/or \"git commit -a\")"
  cause: "コミットする変更がステージされていない"
  fix:
    - "変更を確認する: git status"
    - "ステージしてからコミットする: git add <ファイル>"

- id: git-dubious-ownership
  output: 'dubious ownership in repository at ''(?P<dir>[^'']+)'''
  example: "fatal: detected dubious ownership in repository at '/mnt/c/work/repo'"
  cause: "リポジトリの所有者が現在のユーザーと違うため、git が安全のため操作を拒否した"
  fix:
    - "信頼できるなら許可する: git config --global --add safe.directory '{{dir}}'"
    - "/mnt/c 配下でよく起きる。WSL 側（~ 以下）に置くと速くて確実"

- id: git-identity
  output: 'Please tell me who you are|Author identity unknown'
  example: "Author identity unknown"
  cause: "コミットに使う名前とメールアドレスが設定されていない"
  fix:
    - "git config --global user.name \"名前\""
    - "git config --global user.email \"メール\""

- id: git-large-file
  output: 'GH001|exceeds GitHub''s file size limit|this exceeds .* file size limit'
  example: "remote: error: GH001: Large files detected."
  cause: "GitHub の上限（100MB）を超えるファイルをコミットしている"
  fix:
    - "大きなファイルは Git LFS で管理する: git lfs track '<パターン>'"
    - "直前のコミットなら取り消してやり直す: git reset --soft HEAD~1"

- id: git-merge-in-progress
  output: 'You have not concluded your merge|MERGE_HEAD exists'
  example: "fatal: You have not concluded your merge (MERGE_HEAD exists)."
  cause: "前回のマージが途中のまま残っている"
  fix:
    - "完了させる: 衝突を解消して git commit"
    - "やめる: git merge --abort"

- id: git-rebase-in-progress
  output: 'rebase-merge directory already exists|already a rebase-merge directory|You are in the middle of'
  example: "It seems that there is already a rebase-merge directory"
  cause: "前回のリベースなどが途中のまま残っている"
  fix:
    - "続ける: git rebase --continue"
    - "やめる: git rebase --abort"

- id: git-no-remote
  output: '''(?P<remote>[^'']+)'' does not appear to be a git repository|No such remote'
  example: "fatal: 'origin' does not appear to be a git repository"
  priority: 1
  cause: "リモート「{{remote}}」が登録されていない"
  fix:
    - "確認する: git remote -v"
    - "追加する: git remote add origin <URL>"

- id: git-generic
  prog: git
  code: [128]
  priority: -1
  cause: "git が致命的エラー（fatal）で終了した"
  fix:
    - "fatal: の行に具体的な理由が出ている"

- id: git-not-a-command
  output: 'git: ''(?P<sub>[^'']+)'' is not a git command(?:[\s\S]*?most similar commands? (?:is|are)\s+(?P<sug>\S+))?'
  example: "git: 'stauts' is not a git command. See 'git --help'.\n\nThe most similar command is\n\tstatus"
  priority: 1
  cause: "「git {{sub}}」というサブコマンドはない"
  fix:
    - "もしかして: git {{sug}}"
    - "ファイルを消すなら git rm、ブランチを消すなら git branch -d <ブランチ>"
    - "サブコマンド一覧: git help -a"

- id: git-unknown-revision
  output: 'ambiguous argument ''(?P<ref>[^'']+)'': unknown revision'
  example: "fatal: ambiguous argument 'mian': unknown revision or path not in the working tree."
  cause: "ブランチ・タグ・コミット「{{ref}}」が見つからない"
  fix:
    - "ブランチ一覧を確認する: git branch -a"
    - "リモートの最新を取得する: git fetch --all --tags"
    - "ファイルを指定したいなら -- で区切る: git log -- {{ref}}"

- id: git-branch-exists
  output: 'a branch named ''(?P<name>[^'']+)'' already exists'
  example: "fatal: a branch named 'feature' already exists"
  cause: "ブランチ「{{name}}」はすでにある"
  fix:
    - "そのブランチに移る: git switch {{name}}"
    - "作り直すなら: git switch -C {{name}}（既存のブランチを上書きする）"

- id: git-tag-exists
  output: 'tag ''(?P<name>[^'']+)'' already exists'
  example: "fatal: tag 'v0.1.6' already exists"
  cause: "タグ「{{name}}」はすでにある"
  fix:
    - "次のバージョン番号を使う（git tag --sort=-v:refname | head で最新を確認）"
    - "付け直すなら（未 push の場合のみ）: git tag -d {{name}}"

- id: git-no-commits
  output: 'does not have any commits yet|bad default revision ''HEAD'''
  example: "fatal: your current branch 'main' does not have any commits yet"
  cause: "まだ 1 つもコミットがない"
  fix:
    - "最初のコミットを作る: git add . && git commit -m \"initial commit\""

- id: git-detached-head
  output: "You are in 'detached HEAD' state|HEAD detached at"
  example: "You are in 'detached HEAD' state. You can look around, make experimental"
  cause: "ブランチではなく特定のコミットを直接チェックアウトしている（detached HEAD）"
  fix:
    - "ブランチに戻る: git switch -"
    - "今の状態で作業を続けるならブランチを作る: git switch -c <新しいブランチ名>"

- id: git-shallow-update
  output: 'shallow update not allowed|--unshallow on a complete repository|fatal: refusing to fetch into.*shallow'
  example: " ! [remote rejected] main -> main (shallow update not allowed)"
  cause: "浅い clone（--depth）なので履歴が足りず、この操作ができない"
  fix:
    - "全履歴を取得する: git fetch --unshallow"

- id: git-refusing-merge-unrelated
  output: 'refusing to merge unrelated histories'
  example: "fatal: refusing to merge unrelated histories"
  priority: 1
  cause: "共通の祖先を持たない 2 つの履歴を merge しようとしている"
  fix:
    - "意図通りなら許可して取り込む: git pull origin main --allow-unrelated-histories"

- id: git-cherry-pick-conflict
  output: 'could not apply (?P<commit>[0-9a-f]{7,})|after resolving the conflicts, mark the corrected paths'
  example: "error: could not apply 1a2b3c4... fix typo"
  cause: "cherry-pick / revert / rebase でコミットを適用中に競合した"
  fix:
    - "競合を直して git add <file> → git cherry-pick --continue（rebase なら git rebase --continue）"
    - "やめるなら: git cherry-pick --abort（または git rebase --abort）"

- id: git-cherry-pick-in-progress
  output: 'cherry-pick is already in progress|You have not concluded your cherry-pick'
  example: "error: cherry-pick is already in progress"
  cause: "前回の cherry-pick が途中のまま残っている"
  fix:
    - "続ける: git cherry-pick --continue"
    - "取り消す: git cherry-pick --abort"

- id: git-not-a-remote-repo
  output: "'(?P<remote>[^']+)' does not appear to be a git repository"
  example: "fatal: 'origin' does not appear to be a git repository"
  cause: "リモート「{{remote}}」が登録されていない、または URL が間違っている"
  fix:
    - "登録済みのリモートを確認: git remote -v"
    - "追加する: git remote add {{remote}} <URL>"

- id: git-ssh-publickey
  output: 'git@[^:]+: Permission denied \(publickey\)'
  example: "git@github.com: Permission denied (publickey)."
  priority: 1
  cause: "git の SSH 接続で公開鍵認証に失敗した（鍵が未登録か ssh-agent に鍵がない）"
  fix:
    - "接続確認: ssh -T git@github.com"
    - "鍵が無ければ作成: ssh-keygen -t ed25519 → 公開鍵(~/.ssh/id_ed25519.pub)を GitHub に登録"
    - "HTTPS で使うなら: git remote set-url origin https://github.com/<user>/<repo>.git"

- id: git-cannot-lock-ref
  output: "cannot lock ref '(?P<ref>[^']+)'"
  example: "error: cannot lock ref 'refs/remotes/origin/feature': is at 1a2b3c but expected 4d5e6f"
  cause: "参照「{{ref}}」がロック中、または古い参照と名前が衝突している"
  fix:
    - "古いリモート参照を掃除する: git remote prune origin"
    - "別の git が動いていないか確認し、残ったロックがあれば削除: rm .git/{{ref}}.lock"

- id: git-submodule-not-initialized
  output: 'No url found for submodule path|fatal: not a git repository: .*\.git/modules/'
  example: "fatal: No url found for submodule path 'vendor/lib' in .gitmodules"
  cause: "サブモジュールの設定（.gitmodules）と実体が食い違っている"
  fix:
    - "初期化と取得: git submodule update --init --recursive"
    - "同期し直す: git submodule sync --recursive"

- id: git-empty-submodule
  output: 'already exists in the index|is not a submodule'
  example: "fatal: 'vendor/lib' already exists in the index"
  cause: "追加しようとしたパスが既に通常のファイルとして管理されている"
  fix:
    - "インデックスから外してから追加する: git rm -r --cached <path> && git submodule add <URL> <path>"

- id: git-stash-conflict
  output: 'conflicts in index\. Try without --index|could not restore untracked files from stash|The stash entry is kept in case you need it again'
  example: "The stash entry is kept in case you need it again."
  cause: "stash を戻した時に競合した（stash 自体は残っている）"
  fix:
    - "競合を直して git add → 不要になったら git stash drop"
    - "別ブランチで戻す: git stash branch <新ブランチ名>"

- id: git-would-clobber-tag
  output: 'would clobber existing tag'
  example: " ! [rejected]        v1.0 -> v1.0  (would clobber existing tag)"
  cause: "リモートと手元で同名のタグが別のコミットを指している"
  fix:
    - "リモートのタグで上書き: git fetch --tags --force"

- id: git-bad-object
  output: 'fatal: bad object|error: object file .* is empty|fatal: loose object .* is corrupt|fatal: packed object .* is corrupt'
  example: "error: object file .git/objects/4b/825dc642cb6eb9a060e54bf8d69288fbee4904 is empty"
  cause: "リポジトリのオブジェクトが壊れている（異常終了やディスクの問題など）"
  fix:
    - "状態を確認: git fsck --full"
    - "リモートがあれば別の場所に clone し直して作業ファイルを移すのが確実"

- id: git-rpc-failed
  output: 'RPC failed|early EOF|the remote end hung up unexpectedly|unexpected disconnect while reading sideband packet'
  example: "error: RPC failed; curl 92 HTTP/2 stream 0 was not closed cleanly: CANCEL (err 8)"
  cause: "転送中に接続が切れた（大きすぎる push/clone、不安定な回線、HTTP/2 の問題など）"
  fix:
    - "HTTP/1.1 にする: git config --global http.version HTTP/1.1"
    - "バッファを増やす: git config --global http.postBuffer 524288000"
    - "clone なら浅く取得してから広げる: git clone --depth 1 <URL> → git fetch --unshallow"

- id: git-protected-branch
  output: 'protected branch hook declined|GH006: Protected branch update failed|pre-receive hook declined'
  example: "remote: error: GH006: Protected branch update failed for refs/heads/main."
  cause: "リモート側で保護されたブランチ（またはフック）により push が拒否された"
  fix:
    - "別ブランチに push して Pull Request を作る: git switch -c feature && git push -u origin HEAD"

- id: git-secret-detected
  output: 'GH013: Repository rule violations|Push cannot contain secrets|secret scanning'
  example: "remote: error: GH013: Repository rule violations found for refs/heads/main."
  cause: "コミットにトークンなどの秘密情報が含まれていたため GitHub が push を拒否した"
  fix:
    - "該当ファイルから秘密情報を消し、履歴からも除く（直前なら git commit --amend、古いなら git rebase -i）"
    - "漏れた可能性のあるトークンは失効して再発行する"

- id: git-filename-too-long
  output: 'Filename too long'
  example: "error: unable to create file src/very/long/path/file.ts: Filename too long"
  cause: "パスが長すぎて作成できない（主に Windows 側のファイルシステム）"
  fix:
    - "長いパスを許可する: git config --global core.longpaths true"

- id: git-lf-crlf-warning
  output: '(?:LF|CRLF) will be replaced by (?:CRLF|LF)'
  example: "warning: in the working copy of 'run.sh', LF will be replaced by CRLF the next time Git touches it"
  cause: "改行コードの自動変換（core.autocrlf）が有効になっている（警告のみ）"
  fix:
    - "WSL/Linux では変換しない: git config --global core.autocrlf input"
    - "リポジトリで固定するなら .gitattributes に「* text=auto eol=lf」"

- id: git-worktree-exists
  output: "'(?P<branch>[^']+)' is already (?:checked out|used by worktree) at"
  example: "fatal: 'main' is already checked out at '/home/user/repo'"
  cause: "ブランチ「{{branch}}」は別の worktree で使用中"
  fix:
    - "worktree の一覧: git worktree list"
    - "不要な worktree を消す: git worktree remove <path>"

- id: git-pathspec-not-in-repo
  output: "is outside repository at"
  example: "fatal: /tmp/x.txt: '/tmp/x.txt' is outside repository at '/home/user/repo'"
  cause: "リポジトリの外にあるファイルを指定している"
  fix:
    - "リポジトリ内のパスを指定する（またはファイルをリポジトリ内にコピーする）"

- id: git-lfs-missing
  output: "git-lfs filter-process: git-lfs: command not found|This repository is configured for Git LFS but 'git-lfs' was not found"
  example: "This repository is configured for Git LFS but 'git-lfs' was not found on your path."
  cause: "Git LFS を使うリポジトリだが git-lfs が入っていない"
  fix:
    - "インストール: sudo apt install git-lfs && git lfs install"
    - "実体を取得: git lfs pull"

- id: gh-not-logged-in
  prog: gh
  output: 'gh auth login|not logged into any GitHub hosts|HTTP 401: Bad credentials'
  example: "To get started with GitHub CLI, please run:  gh auth login"
  cause: "GitHub CLI（gh）にログインしていない、またはトークンが無効"
  fix:
    - "ログイン: gh auth login"
    - "状態確認: gh auth status"
