# v* タグの push で npm に公開する
#   git tag v0.1.0 && git push origin v0.1.0
# npm 側で Trusted Publisher（このリポジトリ・release.yml）を設定するか、
# リポジトリの Secrets に NPM_TOKEN を登録しておく。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: go vet ./... && go test ./...
      - run: node npm/build.mjs "${GITHUB_REF_NAME#v}" --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub Release にバイナリを添付
        run: |
          cd dist/npm
          for d in why-*-*; do tar -czf "$d.tar.gz" -C "$d/bin" why; done
          gh release create "$GITHUB_REF_NAME" --generate-notes why-*-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
